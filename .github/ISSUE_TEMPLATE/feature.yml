name: Feature
description: A change to how the atlas is built or shown.
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What you want
      description: The job to be done. Skip architecture lectures unless the change needs one.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: The current path and why it is not enough.
    validations:
      required: true
  - type: dropdown
    id: door
    attributes:
      label: Front door (if it matters)
      options:
        - Folder drop
        - Zip
        - GitHub paste
        - CLI
        - All of them / analyzer
